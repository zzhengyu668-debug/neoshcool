formal_reviews_sha256 = "93e1aa660e81bcb89cca4d1c9661d76ed9893424fd37d5d67e44fb1c7901c553"
formal_products = "data/amazon_reviews_2023/processed/target_products_w3_v1_4_0.parquet"
formal_products_rows = 125
formal_products_sha256 = "e9d0a7548f1568b2bff7b0e2cedd5fa2702cdda2bf507a674a0ad741e89e9a88"
frozen_labels = "data/amazon_reviews_2023/processed/annotation_labels_w5c_b_v1_0.parquet"
frozen_labels_rows = 1500
frozen_labels_sha256 = "4f52aa604c8798f236eb6401d57ab61265cdfef7b1b54b94a0b4376d141b2ec9"
frozen_model = "outputs/models/w5c_b_tfidf_logistic_regression.joblib"
frozen_model_sha256 = "6ddc90014da535e16c13344059315a36a22e0ed59cee3d37825a1b282920c86e"
w5c_b_baseline_predictions = "data/amazon_reviews_2023/interim/w5c_b/baseline_predictions.parquet"
