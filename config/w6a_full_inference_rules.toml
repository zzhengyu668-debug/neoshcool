[model]
model_version = "w5c-b-tfidf-logistic-v1.0"
label_version = "w5c-b-labels-v1.0"
feature_field = "model_text"
decision_threshold = 0.5
positive_class = 1
preprocessing_version = "w5c-b-leading-star-header-v1"
probability_atol = 1e-12
probability_rtol = 1e-12
allow_refit = false
allow_retraining = false

[inference]
batch_size = 4096
compression = "zstd"
minimum_free_gib = 60.0
checkpoint_dir = "data/amazon_reviews_2023/interim/w6a/checkpoints"
staging_dir = "data/amazon_reviews_2023/interim/w6a/staging"

[product_version]
dataset_product_filter_version = "w3-v1.4.0"

[analysis_roles]
smart_plug = "primary"
smart_bulb = "exploratory"
smart_switch = "case_study"

[coverage]
product_month_review_thresholds = [1, 5, 10, 20, 30]
probability_bin_edges = [0.0, 0.01, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95, 0.99, 1.0]

[outputs]
review_predictions = "data/amazon_reviews_2023/processed/review_level_failure_predictions_w6a_v1_0.parquet"
product_month_signals = "data/amazon_reviews_2023/processed/product_month_failure_signals_w6a_v1_0.parquet"
report_dir = "data/amazon_reviews_2023/reports/w6a"
