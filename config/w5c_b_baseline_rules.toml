old_rows = 300
new_rows = 1200
new_double_rows = 240
new_single_rows = 960
cumulative_double_rows = 300
smart_plug = 1137
smart_bulb = 300
smart_switch = 63

[split]
method = "strict_chronological"
train_share = 0.60
validation_share = 0.20
test_share = 0.20
tie_break = "blind_review_id"
allow_random_shuffle = false

[rating_baseline]
name = "B0 Rating"
low_star_threshold = 2.0
low_star_operator = "less_than_or_equal"
uses_rating_as_ground_truth = false

[keyword_baseline]
name = "B3 Keyword/rule draft"
version = "w5a-keyword-v1.0-draft"
refit_from_human_labels = false

[dummy_baseline]
strategy = "most_frequent"
random_state = 20260731

[tfidf]
lowercase = true
ngram_min = 1
ngram_max = 2
min_df = 2
max_features = 20000
sublinear_tf = true
strip_accents = "unicode"
fit_on = "train_only"
input_field = "model_text"

[logistic_regression]
C = 1.0
class_weight = "balanced"
max_iter = 1000
random_state = 20260731
decision_threshold = 0.5

[model_text]
remove_leading_star_title = true
preserve_negations = true
overwrite_review_text = false

[device_support]
minimum_test_rows = 20
minimum_rows_per_binary_class = 5

[outputs]
processed_labels = "data/amazon_reviews_2023/processed/annotation_labels_w5c_b_v1_0.parquet"
modeling_dataset = "data/amazon_reviews_2023/interim/w5c_b/modeling_dataset.parquet"
