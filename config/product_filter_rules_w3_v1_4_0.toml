[release]
version = "w3-v1.4.0"
status = "formal_versioned_release"
base_version = "w3-v1.3.2"
recovery_draft_version = "w3-v1.4.0-draft"
promotion_phase = "W3R-C"
minimum_free_gib = 60
scope = "smart_plug_smart_bulb_smart_switch_only"

[frozen_rule_sources]
base_rules = "config/product_filter_rules.toml"
base_rules_sha256 = "81aec360771b842a1e327749a99400d4588823de60b75831e1784fdc9868943f"
