recovery_rules_sha256 = "4e56ec3018b549e60eb8418576486875143ed60b52e2105aebb4b396d003b6d2"
interpretation = "The two hashed source configurations freeze the complete W3 and W3R-A rule vocabularies; W3R-B final human decisions are authoritative for the 23 recovery candidates."

[inputs]
baseline_products = "data/amazon_reviews_2023/processed/target_products.parquet"
baseline_products_sha256 = "daa3606c9e6b5d47100cad68d683ef9acc1efa9a87832fa8b942c26383dabe5d"
draft_products = "data/amazon_reviews_2023/interim/w3r_a/proposed_target_products_w3_v1_4_draft.parquet"
