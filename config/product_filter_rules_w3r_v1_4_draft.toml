[draft]
version = "w3-v1.4.0-draft"
base_version = "w3-v1.3.2"
status = "draft_not_frozen"
purpose = "W3R-A recall diagnosis for smart bulbs and smart switches"
smart_plug_policy = "retain_all_95_baseline_products_without_expansion"
minimum_free_gib = 60

[inputs]
metadata_candidates = "data/amazon_reviews_2023/interim/metadata_candidates.parquet"
target_products = "data/amazon_reviews_2023/processed/target_products.parquet"
expected_candidate_rows = 37158
expected_target_rows = 106
expected_smart_plugs = 95
expected_smart_bulbs = 8
expected_smart_switches = 3

[fields]
identity = [
  "parent_asin",
  "title",
  "main_category",
  "categories",
  "features",
  "description",
  "store",
  "details",
  "source_domains",
]
forbidden_for_decisions = ["average_rating", "rating_number", "price"]

[audit]
random_seed = 20260729
bulb_recovery_sample_minimum = 200
switch_recovery_sample_minimum = 300
strong_exclusion_controls_per_type = 50
include_all_baseline_bulbs = true
include_all_baseline_switches = true
precision_target = 0.80
ambiguous_rate_target = 0.10
product_count_diagnostic_target = 30
interpretation = "rule_revision_review_not_independent_blind_review"

[matching]
normalization = "Unicode_NFKC_casefold_whitespace_and_punctuation_normalization"
identity_policy = "primary product identity must be explicit in title/categories, except supporting fields may confirm a clearly named product"
smart_control_policy = "specific connected-control evidence is required; the word smart alone is not sufficient when it describes energy efficiency or an unrelated product"
wrong_product_policy = "strong wrong-product terms are applied first to title/categories; incidental compatibility terms in auxiliary metadata do not automatically exclude a product"
multi_type_policy = "hold as ambiguous unless one primary product identity is clearly dominant"

